---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    pipelinesascode.tekton.dev/task: "[opentelemetry-upgrade-tests]"
  name: opentelemetry-operator-upgrade-test-fbc
spec:
  description: |
    This pipeline automates the process of running upgrade tests for OpenShift OpenTelemetry Operator
    using an ephemeral OpenShift CI HyperShift cluster. The pipeline fetches the FBC fragment image, provisions
    the cluster, runs the upgrade tests, and collects artifacts. The cluster is cleaned up automatically with
    the owning PipelineRun.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'opentelemetry-operator-upgrade-test-fbc'
      type: string
    - name: namespace
      description: 'Namespace to run tests in'
      default: 'opentelemetry-operator-system'
      type: string
    - name: operator_csv_version
      description: Version of OpenTelemetry Operator CSV
      type: string
      default: "opentelemetry-operator.v0.158.0-2"
    - name: collector_version
      description: Version of OpenTelemetry Collector (from opentelemetry-collector in versions.txt)
      type: string
      default: "0.158.0"
    - name: ta_version
      description: Version of Target Allocator (from targetallocator in versions.txt)
      type: string
      default: "0.158.0"
    - name: otel_tests_branch
      description: "The repository branch from which to run the tests"
      type: string
      default: "rhosdt-3.11"
    - name: PACKAGE_NAME
      description: "Package name for the bundle"
      default: "opentelemetry-product"
      type: string
    - name: CHANNEL_NAME
      description: "Channel name for the bundle"
      default: "stable"
      type: string
    - name: ocp_version
      description: OpenShift minor version for the ephemeral HyperShift cluster
      default: "4.14"
    - name: compute_node_type
      description: AWS instance type for ephemeral HyperShift worker nodes
      default: "m5.2xlarge"
    - name: hypershift_node_count
      description: Number of worker nodes for the ephemeral HyperShift cluster
      default: "3"
    - name: hosted_management_cluster
      description: Hosted management cluster used to provision the ephemeral cluster
      default: "hosted-mgmt2"
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: prepare-cluster-env
      runAfter:
        - parse-metadata
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: [ "push", "Push", "PUSH", "incoming", "Incoming", "INCOMING" ]
      params:
        - name: compute_node_type
          value: $(params.compute_node_type)
        - name: hypershift_node_count
          value: $(params.hypershift_node_count)
        - name: hosted_management_cluster
          value: $(params.hosted_management_cluster)
      taskSpec:
        params:
          - name: compute_node_type
            type: string
          - name: hypershift_node_count
            type: string
          - name: hosted_management_cluster
            type: string
        results:
          - name: env
            description: OpenShift CI workflow environment as JSON
        steps:
          - name: prepare-env
            image: quay.io/konflux-ci/konflux-test:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              image_content_sources=$(cat <<'EOF'
              - source: registry.redhat.io/rhosdt/opentelemetry-collector-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/otel/opentelemetry-collector
              - source: registry.redhat.io/rhosdt/opentelemetry-target-allocator-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/otel/opentelemetry-target-allocator
              - source: registry.redhat.io/rhosdt/opentelemetry-rhel9-operator
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/otel/opentelemetry-operator
              - source: registry.redhat.io/rhosdt/opentelemetry-operator-bundle
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/otel/opentelemetry-bundle
              EOF
              )

              jq -cn \
                --arg computeNodeType "$(params.compute_node_type)" \
                --arg nodeCount "$(params.hypershift_node_count)" \
                --arg managementCluster "$(params.hosted_management_cluster)" \
                --arg imageContentSources "$image_content_sources" \
                '{
                  COMPUTE_NODE_TYPE: $computeNodeType,
                  HYPERSHIFT_NODE_COUNT: $nodeCount,
                  HOSTED_MANAGEMENT_CLUSTER: $managementCluster,
                  IMAGE_CONTENT_SOURCES: $imageContentSources
                }' | tee "$(results.env.path)"
    - name: provision-cluster
      runAfter:
        - prepare-cluster-env
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: [ "push", "Push", "PUSH", "incoming", "Incoming", "INCOMING" ]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp_version)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.env)
    - name: opentelemetry-upgrade-tests
      description: Task to run tests from service repository
      runAfter:
        - provision-cluster
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: [ "push", "Push", "PUSH", "incoming", "Incoming", "INCOMING" ]
      params:
        - name: OTEL_TESTS_BRANCH
          value: $(params.otel_tests_branch)
        - name: COLLECTOR_VERSION
          value: $(params.collector_version)
        - name: TA_VERSION
          value: $(params.ta_version)
        - name: OPERATOR_CSV_VERSION
          value: $(params.operator_csv_version)
        - name: FBC_FRAGMENT
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: OTEL_TESTS_BRANCH
            type: string
          - name: COLLECTOR_VERSION
            type: string
          - name: TA_VERSION
            type: string
          - name: OPERATOR_CSV_VERSION
            type: string
          - name: FBC_FRAGMENT
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: run-upgrade-tests
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: FBC_FRAGMENT
                value: "$(params.FBC_FRAGMENT)"
              - name: COLLECTOR_VERSION
                value: "$(params.COLLECTOR_VERSION)"
              - name: TA_VERSION
                value: "$(params.TA_VERSION)"
              - name: OPERATOR_CSV_VERSION
                value: "$(params.OPERATOR_CSV_VERSION)"
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              echo "Kubeconfig file"
              cat $KUBECONFIG

              OTEL_TESTS_BRANCH=$(params.OTEL_TESTS_BRANCH)

              echo "Run e2e tests"
              git clone https://github.com/os-observability/opentelemetry-operator.git /tmp/otel-tests
              cd /tmp/otel-tests 
              git checkout $OTEL_TESTS_BRANCH

              #Enable user workload monitoring
              oc apply -f tests/e2e-openshift/otlp-metrics-traces/01-workload-monitoring.yaml
              unset NAMESPACE

              # Execute OpenTelemetry e2e tests
              mkdir -p .testresults/e2e
              
              chainsaw test --quiet tests/e2e-openshift-upgrade --values - <<EOF
              upgrade_fbc_image: $FBC_FRAGMENT
              upgrade_collector_version: $COLLECTOR_VERSION
              upgrade_ta_version: $TA_VERSION
              upgrade_operator_csv_name: $OPERATOR_CSV_VERSION
              EOF
